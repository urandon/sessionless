name: Attached-worker native service integration

on:
  push:
    branches:
      - 'ai/issue-137-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} test-owned user service
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify current-user launchd domain
        if: runner.os == 'macOS'
        run: launchctl print "gui/$(id -u)" >/dev/null

      - name: Prepare current-user systemd manager
        if: runner.os == 'Linux'
        run: |
          runner_user=$(id -un)
          runner_uid=$(id -u)
          sudo loginctl enable-linger "$runner_user"
          sudo systemctl start "user@${runner_uid}.service"
          test -S "/run/user/${runner_uid}/bus"

      - name: Exercise exact service lifecycle
        run: make attached-worker-native-integration

      - name: Remove Linux linger setting
        if: always() && runner.os == 'Linux'
        run: sudo loginctl disable-linger "$(id -un)"
