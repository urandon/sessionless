name: Attached-worker OCI Linux rootless

on:
  push:
    paths:
      - .github/workflows/attached-worker-oci-rootless.yml
      - Makefile
      - build/images.env
      - docs/attached-worker-oci.md
      - go.mod
      - go.sum
      - internal/attachedworkerdaemon/**
      - internal/attachedworkeroci/**
      - scripts/test-attached-worker-oci.sh
      - scripts/test-attached-worker-oci-linux-rootless.sh
      - test/fixtures/attached-worker-oci-probe/**
      - tools/versions.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attached-worker-oci-rootless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootless:
    name: Linux rootless isolation matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Prepare delegated non-root user manager
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor iptables uidmap
          runner_user=$(id -un)
          runner_uid=$(id -u)
          grep -q "^${runner_user}:" /etc/subuid
          grep -q "^${runner_user}:" /etc/subgid
          sudo loginctl enable-linger "$runner_user"
          sudo systemctl start "user@${runner_uid}.service"
          runtime_dir="/run/user/${runner_uid}"
          test -S "${runtime_dir}/bus"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir" >>"$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir" >>"$GITHUB_ENV"

          rootlesskit_path="${RUNNER_TEMP}/sessionless-rootless-toolchain/docker-rootless-extras/rootlesskit"
          profile_name=$(printf '%s' "$rootlesskit_path" | sed -e 's@^/@@' -e 's@/@.@g')
          profile_path="/etc/apparmor.d/${profile_name}"
          test ! -e "$profile_path"
          printf 'SESSIONLESS_ROOTLESS_APPARMOR_PROFILE=%s\n' "$profile_path" >>"$GITHUB_ENV"
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            '' \
            "\"${rootlesskit_path}\" flags=(unconfined) {" \
            '  userns,' \
            '}' | sudo tee "$profile_path" >/dev/null
          sudo apparmor_parser --replace "$profile_path"

      - name: Run pinned Linux rootless isolation matrix
        run: make attached-worker-oci-linux-rootless-ci

      - name: Remove gate AppArmor profile
        if: always()
        run: |
          profile_path="${SESSIONLESS_ROOTLESS_APPARMOR_PROFILE:-}"
          if test -n "$profile_path" && test -f "$profile_path"; then
            sudo apparmor_parser --remove "$profile_path"
            sudo rm -f -- "$profile_path"
          fi
