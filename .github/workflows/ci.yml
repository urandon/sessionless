name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v4

      - name: Set up pinned Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run repository CI contract
        run: make ci

  images:
    name: Runtime images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v4

      - name: Build control-plane and worker images
        run: make images
