name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v6

      - name: Set up pinned Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@11.17.0

      - name: Run repository CI contract
        run: make ci

  web-browser:
    name: Web browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v6

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@11.17.0

      - name: Install locked WebUI dependencies and pinned Chromium runtime
        run: PLAYWRIGHT_INSTALL_ARGS='--with-deps chromium' make web-browser-install

      - name: Run browser and accessibility fixtures
        run: make web-browser-test

  ydb:
    name: YDB schema and state store
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YDB_CONNECTION_STRING: grpc://localhost:2136/local?go_query_mode=scripting&go_fake_tx=scripting&go_query_bind=declare,numeric
      YDB_ANONYMOUS_CREDENTIALS: "1"
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v6

      - name: Set up pinned Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Start pinned YDB Local
        run: |
          . tools/versions.env
          docker run --detach --rm --name sessionless-ydb \
            --hostname localhost \
            --publish 2136:2136 \
            --publish 8765:8765 \
            --env YDB_USE_IN_MEMORY_PDISKS=true \
            "ydbplatform/local-ydb:${YDB_LOCAL_IMAGE_VERSION}"

      - name: Wait for YDB Local
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              http://localhost:8765/monitoring/cluster >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs sessionless-ydb
          exit 1

      - name: Apply schema twice
        run: |
          make migrate-local
          make migrate-local

      - name: Run YDB integration suite
        run: make ydb-integration

      - name: Stop YDB Local
        if: always()
        run: docker stop sessionless-ydb || true

  local-stand:
    name: Local multi-service stand
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v6

      - name: Set up pinned Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Start, initialize, and test the local stand
        run: |
          make e2e-local
          make local-integration

      - name: Prove normal stop and restart preserve the stand
        run: |
          make dev-down
          make dev-up
          make local-integration

      - name: Remove local stand volumes
        if: always()
        run: CONFIRM_LOCAL_RESET=sessionless-dev make dev-reset

  terraform:
    name: Terraform environments
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v6

      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Validate infrastructure contract
        run: make terraform-ci

  cloudflare-edge:
    name: Telegram edge Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v6

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: infra/cloudflare/telegram-edge/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@11.17.0

      - name: Verify Worker contract and bundle
        run: make cloudflare-edge-ci

  images:
    name: Runtime images
    needs:
      - verify
      - ydb
      - local-stand
      - terraform
      - cloudflare-edge
      - web-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: runtime-images-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout mirrored commit
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.36.0

      - name: Build control-plane, Web, and worker images
        env:
          VERSION: ${{ github.sha }}
          IMAGE_PLATFORM: linux/amd64
          DOCKER_BUILD_CACHE: gha
          DOCKER_CACHE_SCOPE_SUFFIX: ${{ github.ref_name }}
        run: make images

      - name: Exchange GitHub OIDC identity for Yandex registry access
        if: github.ref == 'refs/heads/main' && vars.YANDEX_IMAGE_PUBLISH_ENABLED == 'true'
        env:
          YANDEX_OIDC_AUDIENCE: ${{ vars.YANDEX_OIDC_AUDIENCE }}
          YANDEX_EXPECTED_OIDC_SUBJECT: ${{ vars.YANDEX_GITHUB_OIDC_SUBJECT }}
          YANDEX_IMAGE_PUBLISHER_SERVICE_ACCOUNT_ID: ${{ vars.YANDEX_IMAGE_PUBLISHER_SERVICE_ACCOUNT_ID }}
        run: node scripts/github-yandex-registry-login.mjs

      - name: Publish immutable deployment images
        if: github.ref == 'refs/heads/main' && vars.YANDEX_IMAGE_PUBLISH_ENABLED == 'true'
        env:
          YANDEX_CONTAINER_REGISTRY_ID: ${{ vars.YANDEX_CONTAINER_REGISTRY_ID }}
          CLOUD_IMAGE_TAG: ${{ github.sha }}
          CLOUD_IMAGE_MANIFEST_PATH: .build/deployment-images.json
          SOURCE_REPOSITORY: gitcode.com/urandon/sessionless
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$CLOUD_IMAGE_TAG"
          ./scripts/publish-cloud-images.sh
          jq -r '"Published `" + .source_sha + "` as:\n" + (.images | to_entries | map("- `" + .key + "`: `" + .value.reference + "`") | join("\n"))' \
            "$CLOUD_IMAGE_MANIFEST_PATH" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload immutable deployment manifest
        if: github.ref == 'refs/heads/main' && vars.YANDEX_IMAGE_PUBLISH_ENABLED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: deployment-images-${{ github.sha }}
          path: .build/deployment-images.json
          if-no-files-found: error
          retention-days: 30
