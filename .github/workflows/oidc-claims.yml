name: Inspect GitHub OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Safe claim inspection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout mirrored main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Print non-secret OIDC claims
        env:
          OIDC_CLAIM_ONLY: "1"
          YANDEX_OIDC_AUDIENCE: https://github.com/urandon
          IMAGE_PUBLISH_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/github-yandex-registry-login.mjs
