name: sessionless-dev

services:
  ydb-local:
    image: ydbplatform/local-ydb:${YDB_LOCAL_IMAGE_VERSION:-25.3.1.25}
    platform: ${YDB_PLATFORM:-linux/amd64}
    hostname: localhost
    environment:
      GRPC_PORT: "2136"
      MON_PORT: "8765"
      YDB_PDISK_SIZE: ${YDB_PDISK_SIZE:-4GB}
      YDB_USE_IN_MEMORY_PDISKS: ${YDB_USE_IN_MEMORY_PDISKS:-false}
    ports:
      - "${YDB_GRPC_PORT:-2136}:2136"
      - "${YDB_MONITORING_PORT:-8765}:8765"
    volumes:
      - ydb-data:/ydb_data
      - ydb-certs:/ydb_certs
    restart: unless-stopped

  object-storage-local:
    image: minio/minio:${MINIO_IMAGE_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sessionless-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-storage-data:/data
    restart: unless-stopped

  object-storage-init:
    image: minio/mc:${MINIO_MC_IMAGE_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    profiles:
      - tools
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sessionless-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
      S3_BUCKET: ${S3_BUCKET:-sessionless-local}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        mc alias set local http://object-storage-local:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"

  queue-local:
    image: softwaremill/elasticmq-native:${ELASTICMQ_IMAGE_VERSION:-1.6.16}
    ports:
      - "${QUEUE_API_PORT:-9324}:9324"
      - "${QUEUE_UI_PORT:-9325}:9325"
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro
    restart: unless-stopped

  telegram-fake:
    build:
      context: .
      dockerfile: build/control.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
        TARGET: telegram-fake
    environment:
      PORT: "8081"
      TELEGRAM_FAKE_TOKEN: ${TELEGRAM_FAKE_TOKEN:-local-test-token}
    ports:
      - "${TELEGRAM_FAKE_PORT:-8081}:8081"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped

  control-api:
    build:
      context: .
      dockerfile: build/control.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
        TARGET: control-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: "8080"
      YDB_CONNECTION_STRING: grpc://ydb-local:2136/local
      YDB_ANONYMOUS_CREDENTIALS: "1"
      S3_ENDPOINT: http://object-storage-local:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sessionless-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sessionless-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      TELEGRAM_API_BASE_URL: http://telegram-fake:8081
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_FAKE_TOKEN:-local-test-token}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-local-webhook-secret}
      TELEGRAM_IDENTITY_HMAC_KEY: ${TELEGRAM_IDENTITY_HMAC_KEY:-sessionless-local-identity-key-0001}
      TELEGRAM_SOURCE_ID: ${TELEGRAM_SOURCE_ID:-bot-primary}
      DEFAULT_COMPUTE_PROVIDER: ${DEFAULT_COMPUTE_PROVIDER:-codex}
    ports:
      - "${SESSIONLESS_HTTP_PORT:-8080}:8080"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      - ydb-local
      - object-storage-local
      - telegram-fake
    restart: unless-stopped

volumes:
  ydb-data:
  ydb-certs:
  object-storage-data:
