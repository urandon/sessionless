name: sessionless-dev

services:
  ydb-local:
    image: ydbplatform/local-ydb:${YDB_LOCAL_IMAGE_VERSION:-25.3.1.25}
    hostname: localhost
    environment:
      YDB_USE_IN_MEMORY_PDISKS: "true"
      GRPC_PORT: "2136"
      MON_PORT: "8765"
    ports:
      - "${YDB_GRPC_PORT:-2136}:2136"
      - "${YDB_MONITORING_PORT:-8765}:8765"
    restart: unless-stopped

  control-api:
    build:
      context: .
      dockerfile: build/control.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
        TARGET: control-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: "8080"
    ports:
      - "${SESSIONLESS_HTTP_PORT:-8080}:8080"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
