name: sessionless-dev

services:
  ydb-local:
    image: ydbplatform/local-ydb:${YDB_LOCAL_IMAGE_VERSION:-25.3.1.25}
    platform: ${YDB_PLATFORM:-linux/amd64}
    hostname: localhost
    environment:
      GRPC_PORT: "2136"
      MON_PORT: "8765"
      YDB_PDISK_SIZE: ${YDB_PDISK_SIZE:-4GB}
      YDB_USE_IN_MEMORY_PDISKS: ${YDB_USE_IN_MEMORY_PDISKS:-false}
    ports:
      - "${YDB_GRPC_PORT:-2136}:2136"
      - "${YDB_MONITORING_PORT:-8765}:8765"
    volumes:
      - ydb-data:/ydb_data
      - ydb-certs:/ydb_certs
    restart: unless-stopped

  object-storage-local:
    image: minio/minio:${MINIO_IMAGE_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sessionless-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object-storage-data:/data
    restart: unless-stopped

  object-storage-init:
    image: minio/mc:${MINIO_MC_IMAGE_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    profiles:
      - tools
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sessionless-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
      S3_BUCKET: ${S3_BUCKET:-sessionless-local}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        mc alias set local http://object-storage-local:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"

  queue-local:
    image: softwaremill/elasticmq-native:${ELASTICMQ_IMAGE_VERSION:-1.6.16}
    ports:
      - "${QUEUE_API_PORT:-9324}:9324"
      - "${QUEUE_UI_PORT:-9325}:9325"
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro
    restart: unless-stopped

  telegram-fake:
    build:
      context: .
      dockerfile: build/control.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
        TARGET: telegram-fake
    environment:
      PORT: "8081"
      TELEGRAM_FAKE_TOKEN: ${TELEGRAM_FAKE_TOKEN:-local-test-token}
    ports:
      - "${TELEGRAM_FAKE_PORT:-8081}:8081"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped

  control-api:
    build:
      context: .
      dockerfile: build/control.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
        TARGET: control-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: "8080"
      YDB_CONNECTION_STRING: grpc://ydb-local:2136/local?go_balancer=single
      YDB_ANONYMOUS_CREDENTIALS: "1"
      S3_ENDPOINT: http://object-storage-local:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sessionless-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sessionless-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      TELEGRAM_API_BASE_URL: http://telegram-fake:8081
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_FAKE_TOKEN:-local-test-token}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-local-webhook-secret}
      TELEGRAM_IDENTITY_HMAC_KEY: ${TELEGRAM_IDENTITY_HMAC_KEY:-sessionless-local-identity-key-0001}
      TELEGRAM_SOURCE_ID: ${TELEGRAM_SOURCE_ID:-bot-primary}
      DEFAULT_COMPUTE_PROVIDER: ${DEFAULT_COMPUTE_PROVIDER:-codex}
    ports:
      - "${SESSIONLESS_HTTP_PORT:-8080}:8080"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      - ydb-local
      - object-storage-local
      - telegram-fake
    restart: unless-stopped

  telegram-sender:
    build:
      context: .
      dockerfile: build/control.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
        TARGET: telegram-sender
    environment:
      YDB_CONNECTION_STRING: grpc://ydb-local:2136/local?go_balancer=single
      YDB_ANONYMOUS_CREDENTIALS: "1"
      S3_ENDPOINT: http://object-storage-local:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sessionless-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sessionless-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      TELEGRAM_API_BASE_URL: http://telegram-fake:8081
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_FAKE_TOKEN:-local-test-token}
      TELEGRAM_SENDER_POLL_INTERVAL: 250ms
      TELEGRAM_SENDER_BASE_BACKOFF: ${TELEGRAM_SENDER_BASE_BACKOFF:-250ms}
      TELEGRAM_SENDER_MAX_BACKOFF: ${TELEGRAM_SENDER_MAX_BACKOFF:-2s}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      - ydb-local
      - object-storage-local
      - telegram-fake
    restart: unless-stopped

  reconciler:
    build:
      context: .
      dockerfile: build/control.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
        TARGET: reconciler
    environment:
      YDB_CONNECTION_STRING: grpc://ydb-local:2136/local?go_balancer=single
      YDB_ANONYMOUS_CREDENTIALS: "1"
      QUEUE_ENDPOINT: http://queue-local:9324
      QUEUE_REGION: ${QUEUE_REGION:-us-east-1}
      QUEUE_ACCESS_KEY_ID: ${QUEUE_ACCESS_KEY_ID:-sessionless-local}
      QUEUE_SECRET_ACCESS_KEY: ${QUEUE_SECRET_ACCESS_KEY:-sessionless-local-secret}
      DISPATCH_QUEUE_URL: http://queue-local:9324/000000000000/sessionless-dispatch
      DEAD_LETTER_QUEUE_URL: http://queue-local:9324/000000000000/sessionless-dlq
      SCHEDULER_POLL_INTERVAL: 250ms
      SCHEDULER_RESERVATION_TTL: ${SCHEDULER_RESERVATION_TTL:-5m}
      LIMIT_TENANT_QUEUE_DEPTH: ${LIMIT_TENANT_QUEUE_DEPTH:-8}
      LIMIT_ACTIVE_RUNS: ${LIMIT_ACTIVE_RUNS:-1}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      - ydb-local
      - queue-local
    restart: unless-stopped

  worker-runtime:
    profiles:
      - worker
    build:
      context: .
      dockerfile: build/worker-runtime.Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.4}
    environment:
      YDB_CONNECTION_STRING: grpc://ydb-local:2136/local?go_balancer=single
      YDB_ANONYMOUS_CREDENTIALS: "1"
      S3_ENDPOINT: http://object-storage-local:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sessionless-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sessionless-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sessionless-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      QUEUE_ENDPOINT: http://queue-local:9324
      QUEUE_REGION: ${QUEUE_REGION:-us-east-1}
      QUEUE_ACCESS_KEY_ID: ${QUEUE_ACCESS_KEY_ID:-sessionless-local}
      QUEUE_SECRET_ACCESS_KEY: ${QUEUE_SECRET_ACCESS_KEY:-sessionless-local-secret}
      DISPATCH_QUEUE_URL: http://queue-local:9324/000000000000/sessionless-dispatch
      DEAD_LETTER_QUEUE_URL: http://queue-local:9324/000000000000/sessionless-dlq
      WORKER_ID: ${WORKER_ID:-worker-runtime-local}
      WORKER_SCRATCH_ROOT: /tmp/sessionless-worker
      WORKER_LEASE_TTL: ${WORKER_LEASE_TTL:-2m}
      WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-5s}
      WORKER_QUEUE_WAIT: ${WORKER_QUEUE_WAIT:-2s}
      WORKER_MAX_DELIVERY_COUNT: ${WORKER_MAX_DELIVERY_COUNT:-5}
      WORKER_MAX_BLOB_BYTES: ${WORKER_MAX_BLOB_BYTES:-67108864}
      DETERMINISTIC_HARNESS_TURNS: ${DETERMINISTIC_HARNESS_TURNS:-2}
      DETERMINISTIC_HARNESS_ARTIFACTS: ${DETERMINISTIC_HARNESS_ARTIFACTS:-1}
      DETERMINISTIC_HARNESS_FAIL_BEFORE_FIRST_TURN: ${DETERMINISTIC_HARNESS_FAIL_BEFORE_FIRST_TURN:-false}
      DETERMINISTIC_HARNESS_FAIL_AT_TURN: ${DETERMINISTIC_HARNESS_FAIL_AT_TURN:-0}
      DETERMINISTIC_HARNESS_RETRYABLE_FAIL: ${DETERMINISTIC_HARNESS_RETRYABLE_FAIL:-false}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp/sessionless-worker:size=128m,mode=0700,uid=65532,gid=65532
    depends_on:
      - ydb-local
      - object-storage-local
      - queue-local
    restart: "no"

volumes:
  ydb-data:
  ydb-certs:
  object-storage-data:
