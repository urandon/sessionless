# Rules are desired policy, not activated resources. The dev profile selects no
# real alerts before #228 binds selectors, supported surface and a confirmed channel.
schema_version: 1
alerts:
  - id: dispatch_dlq_occupied
    query_ref: dispatch_dlq_messages
    class: queue
    condition: {aggregation: max, operator: gt, value: 0, unit: messages, window: 10m}
    evaluation_delay: 5m
    demand: nonzero_occurrence
    freshness: 5m
    no_data: {no_matching_metrics: no_data, no_points: no_data}
    notifications: {channel_refs: [operator_primary], states: [alarm], repeat: false}
    recovery: manual_positive_evidence
    owner: deployment_operator
    runbook_ref: queue_dlq
