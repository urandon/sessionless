# Policy, not live health: VERIFIED refers to the dated #223 query receipt.
# Private binding values never belong in this file.
schema_version: 1
queries:
  - id: web_requests
    source: native
    service: serverless-apigateway
    metric: api_gateway.requests_count_per_second
    metric_type: DGAUGE
    unit: requests_per_second
    aggregation: max
    series_aggregation: sum
    evidence: VERIFIED
    label_keys: [service, name, gateway]
    qualifications: []
    max_series: 1
    sparse: true
    freshness: last_observed
  - id: control_requests
    source: native
    service: serverless-apigateway
    metric: api_gateway.requests_count_per_second
    metric_type: DGAUGE
    unit: requests_per_second
    aggregation: max
    series_aggregation: sum
    evidence: VERIFIED
    label_keys: [service, name, gateway]
    qualifications: []
    max_series: 1
    sparse: true
    freshness: last_observed
  - id: web_invocations
    source: native
    service: serverless-containers
    metric: serverless.containers.started_per_second
    metric_type: DGAUGE
    unit: invocations_per_second
    aggregation: max
    series_aggregation: none
    evidence: VERIFIED
    label_keys: [service, name, container, revision]
    qualifications: []
    max_series: 1
    sparse: true
    freshness: last_observed
  - id: dispatch_messages
    source: native
    service: message-queue
    metric: queue.messages.stored_count
    metric_type: DGAUGE
    unit: messages
    aggregation: max
    series_aggregation: none
    evidence: VERIFIED
    label_keys: [service, name, queue]
    qualifications: []
    max_series: 1
    sparse: false
    freshness: 5m
  - id: dispatch_dlq_messages
    source: native
    service: message-queue
    metric: queue.messages.stored_count
    metric_type: DGAUGE
    unit: messages
    aggregation: max
    series_aggregation: none
    evidence: VERIFIED
    label_keys: [service, name, queue]
    qualifications: []
    max_series: 1
    sparse: false
    freshness: 5m
